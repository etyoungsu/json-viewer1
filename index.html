<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON Studio — JSON & JSONL Formatter</title>
  <meta name="description" content="Format JSON and JSONL in your browser. Automatically detect formats and explore collapsible trees.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23745ae8'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='42' fill='white' font-family='monospace'%3E%7B%7D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=acd28c9f12f402c0">
  <script src="./app.js?v=acd28c9f12f402c0" defer></script>
</head>
<body>
  <main>
    <section class="workspace wrap-lines" aria-label="JSON formatter">
      <div class="main-toolbar"><div class="toolbar-group"><span class="tool-brand">JSON Studio</span><button id="format" class="primary"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 2-8 10h6l-2 6 8-10h-6z"/></svg>JSON Format <kbd id="shortcut">Ctrl ↵</kbd></button><span class="auto-hint">Auto-detect JSON / JSONL</span></div><div class="toolbar-group secondary-actions"><button id="theme-toggle" class="theme-toggle" aria-pressed="true" title="Toggle dark mode"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M17 11.5A7.5 7.5 0 0 1 8.5 3 7.5 7.5 0 1 0 17 11.5Z"/></svg><span>Dark mode</span></button><label class="button" tabindex="0" id="upload-label"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m-4 4 4-4 4 4M3 13v4h14v-4"/></svg>Open file<input id="file" type="file" accept=".json,.jsonl,.ndjson,.txt,application/json" hidden></label><button id="clear" class="icon-button" title="Clear all" aria-label="Clear all"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M8 5V3h4v2M5 5l1 12h8l1-12M8 8v6m4-6v6"/></svg></button></div></div>
      <div class="workspace-tabs"><div class="workspace-tablist" role="tablist" aria-label="Workspace view"><button id="input-tab" role="tab" aria-selected="true" aria-controls="input-panel" tabindex="0" class="selected">Input</button><button id="output-tab" role="tab" aria-selected="false" aria-controls="output-panel" tabindex="-1">Output</button></div><label class="markdown-toggle" title="Preview Markdown in string values only"><input id="markdown-values" type="checkbox">Markdown values</label><label class="wrap-toggle" title="Wrap long lines to fit the window without changing your data"><input id="wrap-lines" type="checkbox" checked>Wrap lines</label></div>
      <div class="panes">
        <section id="input-panel" class="pane input-pane" role="tabpanel" aria-labelledby="input-tab"><div class="editor-wrap"><div id="gutter" class="gutter" aria-hidden="true">1</div><textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="soft" aria-label="JSON or JSONL input" placeholder='Paste your JSON or JSONL here...'></textarea></div><div class="pane-footer"><span id="source-stats">0 lines · 0 B</span><span class="input-meta"><span id="draft-status" role="status" aria-live="polite"></span><span class="auto-pill" id="input-type">AUTO</span><span>UTF-8</span></span></div></section>
        <section id="output-panel" class="pane output-pane" role="tabpanel" aria-labelledby="output-tab" hidden>
          <div class="output-tools"><span id="stale" class="stale" hidden>Input changed</span><div class="search-wrap"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input id="search" type="search" placeholder="Search keys or values" aria-label="Search output tree" aria-describedby="search-help"><span id="search-count" aria-live="polite"></span><button id="search-prev" class="search-nav icon-button" aria-label="Previous match" title="Previous match (Shift+Enter / Up arrow)">↑</button><button id="search-next" class="search-nav icon-button" aria-label="Next match" title="Next match (Enter / Down arrow)">↓</button><span id="search-help" class="sr-only">Enter or Down arrow moves to the next match. Shift+Enter or Up arrow moves to the previous match.</span></div><div class="view-actions"><button id="expand" class="icon-button" title="Expand all" aria-label="Expand all"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 4-4 4 4M10 2v6m-4 6 4 4 4-4m-4 4v-6"/></svg></button><button id="collapse" class="icon-button" title="Collapse all" aria-label="Collapse all"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 3 4 4 4-4M10 1v6m-4 10 4-4 4 4m-4-4v6"/></svg></button><span class="divider"></span><button id="copy" class="icon-button" title="Copy output" aria-label="Copy output"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 7V3H3v10h4"/></svg></button><button id="download" class="icon-button" title="Download output" aria-label="Download output"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v11m-4-4 4 4 4-4M3 13v4h14v-4"/></svg></button></div></div>
          <div id="work-status" class="work-status" role="status" hidden><span id="work-message"></span><button id="cancel-work">Cancel</button></div><nav id="sticky-context" class="sticky-context" aria-label="Parent hierarchy"></nav><div id="result-area" class="result-area" tabindex="0" aria-label="Scrollable JSON output"><div id="tree" aria-label="JSON tree"></div><div id="empty" class="empty-state" hidden><p>Format your input to view the JSON tree.</p></div><div id="error" class="error-state" role="alert" hidden></div></div>
          <div class="pane-footer"><span id="result-status"><span class="green-dot"></span>Ready</span><span id="result-count">—</span></div>
        </section>
      </div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
</body></html>
